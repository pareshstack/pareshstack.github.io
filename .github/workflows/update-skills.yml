name: Update skills list

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build skills.json from the pareshstack-skills repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Runs here (authenticated, 1000 calls/hour) so visitors' browsers
          # never hit GitHub's 60-calls/hour anonymous limit.
          python3 - <<'PY'
          import json, os, re, urllib.request

          OWNER, REPO, BRANCH = "pareshstack", "pareshstack-skills", "main"
          TOKEN = os.environ["GH_TOKEN"]

          def get(url, raw=False):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {TOKEN}", "User-Agent": "skills-sync"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode()
              return body if raw else json.loads(body)

          def frontmatter(text):
              m = re.match(r"^---\s*([\s\S]*?)\s*---", text)
              meta = {}
              if m:
                  for line in m.group(1).split("\n"):
                      if ":" in line:
                          k, v = line.split(":", 1)
                          meta[k.strip()] = v.strip().strip("\"'")
              return meta

          skills = []
          items = get(f"https://api.github.com/repos/{OWNER}/{REPO}/contents/skills?ref={BRANCH}")
          for d in sorted((i for i in items if i["type"] == "dir"), key=lambda i: i["name"]):
              files = {f["name"] for f in get(d["url"])}
              meta = {}
              if "SKILL.md" in files:
                  meta = frontmatter(get(f"https://raw.githubusercontent.com/{OWNER}/{REPO}/{BRANCH}/skills/{d['name']}/SKILL.md", raw=True))
              preview = next((n for n in ("preview.svg", "preview.png", "preview.jpg") if n in files), "")
              skills.append({
                  "folder": d["name"],
                  "name": meta.get("name") or d["name"],
                  "category": meta.get("category") or "Other",
                  "description": meta.get("description") or "A Claude skill — see the repo for details.",
                  "preview": preview,
              })

          if not skills:
              raise SystemExit("No skills found; leaving skills.json unchanged")
          with open("skills.json", "w") as f:
              json.dump(skills, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print("Wrote", len(skills), "skills")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills.json
          git diff --cached --quiet || git commit -m "Update skills list [skip ci]"
          git push
