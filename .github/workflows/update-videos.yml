name: Update latest videos

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest videos from channel RSS feed
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          CHANNEL_ID = "UCHzeZ3vqw0yVTuLA9EbAe1Q"
          url = "https://www.youtube.com/feeds/videos.xml?channel_id=" + CHANNEL_ID

          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = r.read()

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015",
          }
          root = ET.fromstring(data)

          videos = []
          for entry in root.findall("atom:entry", ns)[:6]:
              vid_el = entry.find("yt:videoId", ns)
              title_el = entry.find("atom:title", ns)
              published_el = entry.find("atom:published", ns)
              if vid_el is None or title_el is None:
                  continue
              videos.append({
                  "id": vid_el.text,
                  "title": title_el.text,
                  "published": published_el.text if published_el is not None else None,
              })

          with open("videos.json", "w") as f:
              json.dump(videos, f, indent=2)
              f.write("\n")

          print("Wrote", len(videos), "videos")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || git commit -m "Update latest videos [skip ci]"
          git push
