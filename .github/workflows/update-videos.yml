name: Update latest videos

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up yt-dlp
        run: pip install --quiet --no-input yt-dlp

      - name: Fetch latest long-form videos from the channel's Videos tab
        run: |
          # The channel's "Videos" tab already excludes Shorts (those live
          # under a separate "Shorts" tab), so this avoids the RSS feed's
          # 15-item cap and the need to probe each video individually.
          yt-dlp --flat-playlist --playlist-end 5 --dump-single-json \
            "https://www.youtube.com/@pareshstack/videos" > raw.json

          python3 - <<'PY'
          import json

          with open("raw.json") as f:
              data = json.load(f)

          videos = []
          for e in data.get("entries", [])[:5]:
              vid = e.get("id")
              title = e.get("title")
              if not vid or not title:
                  continue
              videos.append({"id": vid, "title": title})

          with open("videos.json", "w") as f:
              json.dump(videos, f, indent=2)
              f.write("\n")

          print("Wrote", len(videos), "long-form videos")
          PY
          rm -f raw.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || git commit -m "Update latest videos [skip ci]"
          git push
